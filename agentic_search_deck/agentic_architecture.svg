  <rect x="350" y="380" width="300" height="120" rx="14" fill="#48EFCF"/>
  <text x="500" y="422" text-anchor="middle" font-size="21" font-weight="800" fill="#153385">product_search</text>
  <text x="500" y="452" text-anchor="middle" font-size="17" fill="#153385">template: hybrid + rerank</text>
  <text x="500" y="478" text-anchor="middle" font-size="17" fill="#153385">index: products</text>
  <rect x="670" y="380" width="300" height="120" rx="14" fill="#FEC514"/>
  <text x="820" y="422" text-anchor="middle" font-size="21" font-weight="800" fill="#1C1E23">analytics</text>
  <text x="820" y="452" text-anchor="middle" font-size="17" fill="#1C1E23">template: aggregations</text>
  <text x="820" y="478" text-anchor="middle" font-size="17" fill="#1C1E23">index: products</text>
  <rect x="990" y="380" width="300" height="120" rx="14" fill="#FF957D"/>
  <text x="1140" y="422" text-anchor="middle" font-size="21" font-weight="800" fill="#1C1E23">support_question</text>
  <text x="1140" y="452" text-anchor="middle" font-size="17" fill="#1C1E23">template: hybrid + rerank</text>
  <text x="1140" y="478" text-anchor="middle" font-size="17" fill="#1C1E23">index: support-kb</text>
  <text x="820" y="545" text-anchor="middle" font-size="18" fill="#595959">out_of_scope → the agent decides not to search at all</text>
  <rect x="350" y="575" width="940" height="60" rx="12" fill="#ffffff" stroke="#0B64DD" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="820" y="612" text-anchor="middle" font-size="18" fill="#153385">Stored search templates (mustache): the LLM supplies parameters, never query DSL</text>
  <rect x="1370" y="120" width="210" height="220" rx="16" fill="#153385"/>
  <text x="1475" y="170" text-anchor="middle" font-size="23" font-weight="800" fill="#ffffff">EIS</text>
