  <text x="1475" y="240" text-anchor="middle" font-size="17" fill="#ffffff">Jina embeddings v5</text>
  <text x="1475" y="270" text-anchor="middle" font-size="17" fill="#ffffff">(semantic_text)</text>
  <text x="1475" y="300" text-anchor="middle" font-size="17" fill="#ffffff">Jina reranker v3</text>
  <rect x="1370" y="390" width="210" height="220" rx="16" fill="#0B64DD"/>
  <text x="1475" y="440" text-anchor="middle" font-size="23" font-weight="800" fill="#ffffff">Elasticsearch</text>
  <text x="1475" y="480" text-anchor="middle" font-size="17" fill="#ffffff">products</text>
  <text x="1475" y="510" text-anchor="middle" font-size="17" fill="#ffffff">support-kb</text>
  <text x="1475" y="540" text-anchor="middle" font-size="17" fill="#ffffff">BM25 · vectors</text>
  <text x="1475" y="570" text-anchor="middle" font-size="17" fill="#ffffff">RRF · aggs</text>
  <line x1="1320" y1="230" x2="1366" y2="230" stroke="#153385" stroke-width="3" marker-end="url(#arr)"/>
