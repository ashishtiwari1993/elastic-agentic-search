  <text x="350" y="100" font-size="22" font-weight="800" fill="#0B64DD">Kibana · Agent Builder tool: shop.agentic_search</text>
  <text x="350" y="130" font-size="18" fill="#595959">POST /api/agent_builder/tools/_execute → Workflow agentic_product_search</text>
  <rect x="350" y="170" width="220" height="150" rx="14" fill="#0B64DD"/>
  <text x="460" y="215" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">1 Understand</text>
  <text x="460" y="250" text-anchor="middle" font-size="17" fill="#ffffff">ai.prompt → EIS LLM</text>
  <text x="460" y="276" text-anchor="middle" font-size="17" fill="#ffffff">intent · filters · rewrite</text>
  <text x="460" y="302" text-anchor="middle" font-size="17" fill="#ffffff">JSON schema output</text>
  <rect x="610" y="170" width="200" height="150" rx="14" fill="#0B64DD"/>
  <text x="710" y="215" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">2 Plan</text>
  <text x="710" y="250" text-anchor="middle" font-size="17" fill="#ffffff">data.set</text>
  <text x="710" y="276" text-anchor="middle" font-size="17" fill="#ffffff">guardrails →</text>
  <text x="710" y="302" text-anchor="middle" font-size="17" fill="#ffffff">template params</text>
  <rect x="850" y="170" width="200" height="150" rx="14" fill="#0B64DD"/>
  <text x="950" y="215" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">3 Route</text>
  <text x="950" y="250" text-anchor="middle" font-size="17" fill="#ffffff">switch on intent</text>
  <text x="950" y="276" text-anchor="middle" font-size="17" fill="#ffffff">+ if 0 hits → relax</text>
  <text x="950" y="302" text-anchor="middle" font-size="17" fill="#ffffff">and retry</text>
  <rect x="1090" y="170" width="200" height="150" rx="14" fill="#153385"/>
  <text x="1190" y="215" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">4 Respond</text>
  <text x="1190" y="250" text-anchor="middle" font-size="17" fill="#ffffff">workflow.output</text>
  <text x="1190" y="276" text-anchor="middle" font-size="17" fill="#ffffff">ES JSON</text>
  <text x="1190" y="302" text-anchor="middle" font-size="17" fill="#ffffff">+ agentic block</text>
  <line x1="570" y1="245" x2="606" y2="245" stroke="#153385" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="810" y1="245" x2="846" y2="245" stroke="#153385" stroke-width="3" marker-end="url(#arr)"/>
