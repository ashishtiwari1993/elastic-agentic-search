<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" font-family="Inter, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#153385"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1600" height="720" fill="#ffffff"/>
  <rect x="20" y="250" width="200" height="120" rx="16" fill="#EEEEEE"/>
  <text x="120" y="300" text-anchor="middle" font-size="24" font-weight="700" fill="#1C1E23">Demo UI</text>
  <text x="120" y="332" text-anchor="middle" font-size="18" fill="#595959">no search logic</text>
  <rect x="20" y="430" width="200" height="120" rx="16" fill="#EEEEEE"/>
  <text x="120" y="480" text-anchor="middle" font-size="24" font-weight="700" fill="#1C1E23">Any agent</text>
  <text x="120" y="512" text-anchor="middle" font-size="18" fill="#595959">MCP / A2A</text>
