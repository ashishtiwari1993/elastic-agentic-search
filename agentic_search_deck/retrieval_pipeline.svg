<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" font-family="Inter, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#153385"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1600" height="640" fill="#ffffff"/>
  <rect x="20" y="200" width="230" height="160" rx="16" fill="#EEEEEE"/>
  <text x="135" y="245" text-anchor="middle" font-size="22" font-weight="800" fill="#1C1E23">Template params</text>
  <text x="135" y="280" text-anchor="middle" font-size="17" fill="#595959">search_text</text>
  <text x="135" y="306" text-anchor="middle" font-size="17" fill="#595959">categories · brands</text>
  <text x="135" y="332" text-anchor="middle" font-size="17" fill="#595959">price · rating · stock</text>
  <rect x="330" y="90" width="330" height="150" rx="16" fill="#0B64DD"/>
  <text x="495" y="135" text-anchor="middle" font-size="23" font-weight="800" fill="#ffffff">Lexical (BM25)</text>
  <text x="495" y="170" text-anchor="middle" font-size="17" fill="#ffffff">multi_match, fuzziness AUTO</text>
  <text x="495" y="198" text-anchor="middle" font-size="17" fill="#ffffff">title^4 · brand^3 · tags^2</text>
  <text x="495" y="224" text-anchor="middle" font-size="17" fill="#ffffff">+ extracted filters</text>
  <rect x="330" y="320" width="330" height="150" rx="16" fill="#0B64DD"/>
  <text x="495" y="365" text-anchor="middle" font-size="23" font-weight="800" fill="#ffffff">Semantic</text>
  <text x="495" y="400" text-anchor="middle" font-size="17" fill="#ffffff">semantic_text</text>
  <text x="495" y="428" text-anchor="middle" font-size="17" fill="#ffffff">Jina embeddings v5 on EIS</text>
  <text x="495" y="454" text-anchor="middle" font-size="17" fill="#ffffff">+ extracted filters</text>
  <line x1="250" y1="260" x2="326" y2="175" stroke="#153385" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="250" y1="300" x2="326" y2="390" stroke="#153385" stroke-width="3" marker-end="url(#ah)"/>
  <rect x="740" y="205" width="230" height="150" rx="16" fill="#153385"/>
  <text x="855" y="255" text-anchor="middle" font-size="23" font-weight="800" fill="#ffffff">RRF</text>
  <text x="855" y="290" text-anchor="middle" font-size="17" fill="#ffffff">rank fusion</text>
  <text x="855" y="318" text-anchor="middle" font-size="17" fill="#ffffff">top 50</text>
  <line x1="660" y1="165" x2="736" y2="250" stroke="#153385" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="660" y1="395" x2="736" y2="310" stroke="#153385" stroke-width="3" marker-end="url(#ah)"/>
  <rect x="1050" y="205" width="250" height="150" rx="16" fill="#48EFCF"/>
  <text x="1175" y="255" text-anchor="middle" font-size="23" font-weight="800" fill="#153385">Rerank</text>
  <text x="1175" y="290" text-anchor="middle" font-size="17" fill="#153385">Jina reranker v3</text>
  <text x="1175" y="318" text-anchor="middle" font-size="17" fill="#153385">top 20 → top 12</text>
  <line x1="970" y1="280" x2="1046" y2="280" stroke="#153385" stroke-width="3" marker-end="url(#ah)"/>
  <polygon points="1450,215 1540,280 1450,345 1360,280" fill="#FEC514"/>
  <text x="1450" y="276" text-anchor="middle" font-size="19" font-weight="800" fill="#1C1E23">0 hits?</text>
  <text x="1450" y="300" text-anchor="middle" font-size="15" fill="#1C1E23">workflow if</text>
  <line x1="1300" y1="280" x2="1356" y2="280" stroke="#153385" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="1450" y1="345" x2="1450" y2="436" stroke="#153385" stroke-width="3" marker-end="url(#ah)"/>
  <text x="1468" y="398" font-size="17" font-weight="700" fill="#153385">yes</text>
  <rect x="1150" y="440" width="430" height="120" rx="16" fill="#FF957D"/>
  <text x="1365" y="485" text-anchor="middle" font-size="21" font-weight="800" fill="#1C1E23">Self-correct</text>
  <text x="1365" y="518" text-anchor="middle" font-size="17" fill="#1C1E23">drop filters, hybrid + rerank on</text>
  <text x="1365" y="542" text-anchor="middle" font-size="17" fill="#1C1E23">the raw request, flag relaxed=true</text>
  <line x1="1450" y1="215" x2="1450" y2="130" stroke="#153385" stroke-width="3" marker-end="url(#ah)"/>
  <text x="1468" y="175" font-size="17" font-weight="700" fill="#153385">no</text>
  <rect x="1330" y="50" width="250" height="76" rx="14" fill="#0B64DD"/>
  <text x="1455" y="96" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">Return ES JSON</text>
  <text x="800" y="600" text-anchor="middle" font-size="19" fill="#595959">One stored template, two branches: text + relevance → hybrid + rerank; filters only or sort by price/rating → filtered BM25 + sort</text>
</svg>
